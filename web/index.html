<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Pure Connection Test // Digi Keychain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body { background: #0a0e17; color: #e2e8f0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; max-width: 480px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        h1 { font-size: 1.3rem; color: #00f0ff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
        .btn-connect { background: #00f0ff; color: #0a0e17; }
        .btn-connect:active { transform: scale(0.98); }
        .btn-test { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; }
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 16px; background: #334155; color: #94a3b8; }
        .status-pill.online { background: rgba(0,240,255,0.2); color: #00f0ff; border: 1px solid #00f0ff; }
        #terminal { background: #05070a; border: 1px solid #1e293b; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.8rem; color: #a5f3fc; height: 200px; overflow-y: auto; text-align: left; margin-top: 16px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ BLE Connection Test</h1>
        <p>Isolated minimal Bluetooth connection diagnostic.</p>
        
        <div id="status" class="status-pill">STATUS: OFFLINE</div>
        
        <button id="btnConnect" class="btn btn-connect" onclick="connect()">CONNECT TO DIGI_KEYCHAIN</button>
        <button class="btn btn-test" onclick="sendPing()">SEND TEST PING (MODE WRITE)</button>
        
        <div id="terminal">> Diagnostics ready. Tap Connect...</div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_MODE_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_BATTERY_UUID = "6e400007-b5a3-f393-e0a9-e50e24dcca9e";

        let device = null;
        let charMode = null;
        let charBattery = null;

        function log(msg) {
            const term = document.getElementById('terminal');
            const d = new Date().toLocaleTimeString();
            term.innerHTML += `<br>[${d}] ${msg}`;
            term.scrollTop = term.scrollHeight;
        }

        async function connect() {
            try {
                log("Requesting Bluetooth device...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { name: 'DIGI_KEYCHAIN' },
                        { namePrefix: 'DIGI' }
                    ],
                    optionalServices: [ SERVICE_UUID ]
                });

                log(`Found: ${device.name || 'DIGI_KEYCHAIN'}. Connecting to GATT...`);
                device.addEventListener('gattserverdisconnected', () => {
                    log("⚠️ Device disconnected.");
                    document.getElementById('status').innerText = "STATUS: DISCONNECTED";
                    document.getElementById('status').className = "status-pill";
                });

                const server = await device.gatt.connect();
                log("✅ GATT Connected! Getting primary service...");

                const service = await server.getPrimaryService(SERVICE_UUID);
                log("✅ Primary service retrieved successfully!");

                charMode = await service.getCharacteristic(CHAR_MODE_UUID);
                log("✅ Mode characteristic ready!");

                charBattery = await service.getCharacteristic(CHAR_BATTERY_UUID);
                log("✅ Battery characteristic ready! Subscribing to notifications...");
                await charBattery.startNotifications();
                charBattery.addEventListener('characteristicvaluechanged', (e) => {
                    const str = new TextDecoder().decode(e.target.value);
                    log(`🔋 Battery Telemetry: ${str}`);
                });

                document.getElementById('status').innerText = "STATUS: ONLINE ⚡";
                document.getElementById('status').className = "status-pill online";
                document.getElementById('btnConnect').innerText = "CONNECTED";
                log("🎉 COMPLETE SUCCESS! Web-BLE is 100% operational.");
            } catch (err) {
                console.error(err);
                log(`❌ Error: ${err.message}`);
            }
        }

        async function sendPing() {
            if (!charMode) {
                log("Connect first!");
                return;
            }
            try {
                const data = new TextEncoder().encode("PING_TEST");
                await charMode.writeValue(data);
                log("📤 Test write sent to ESP32!");
            } catch (e) {
                log(`Write error: ${e.message}`);
            }
        }
    </script>
</body>
</html>
