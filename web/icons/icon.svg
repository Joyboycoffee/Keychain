<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#2a2e3d" stroke-width="4"/>

  <!-- Tactical Spearhead Stylized Icon -->
  <g transform="translate(256, 210)">
    <!-- Shovel / Spear Shape -->
    <path d="M0 -120 L75 30 L45 80 L0 50 L-45 80 L-75 30 Z" fill="url(#silverGrad)" stroke="#475569" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 -120 L0 50" stroke="#94a3b8" stroke-width="4"/>
    
    <!-- Flowing Tactical Scarf Accent -->
    <path d="M-110 -20 Q -40 -60 30 -30 Q 120 0 140 -40 Q 110 30 20 15 Q -60 25 -110 -20 Z" fill="url(#accentGrad)" opacity="0.95"/>
    <path d="M-130 30 Q -60 0 10 35 Q 90 60 110 20 Q 80 80 -10 65 Q -80 75 -130 30 Z" fill="url(#accentGrad)" opacity="0.9"/>
  </g>

  <!-- Clean Professional Typography -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="7">SPEARHEAD</text>
  
  <!-- Subtle Badge Subtitle -->
  <rect x="186" y="408" width="140" height="24" rx="4" fill="#1e2330" stroke="#333a4d" stroke-width="1.5"/>
  <text x="256" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2.5">KEYCHAIN OS</text>
</svg>
