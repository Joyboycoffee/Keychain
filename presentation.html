<h1 id="%F0%9F%92%A1-1-what-is-a-microcontroller-esp32-c3"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 1. What is a Microcontroller (ESP32-C3)?</h1>
<p>A microcontroller is a complete computer on a single chip containing:</p>
<ul>
<li><strong>Processor Core (CPU)</strong>: Executes code instructions one by one.</li>
<li><strong>RAM (Memory)</strong>: Fast temporary workbench for variables and graphics.</li>
<li><strong>Flash (Storage)</strong>: Permanent hard drive where your compiled code lives.</li>
<li><strong>GPIO (General Purpose Input/Output)</strong>: Physical metal pins that can send or receive electricity to control displays, sensors, buttons, and LEDs.</li>
</ul>
</section>

<h3 id="modes-of-a-digital-pin">Modes of a Digital Pin:</h3>
<ol>
<li><strong><code>OUTPUT</code></strong>: The ESP32 sends electricity OUT (e.g., turning on an LED or screen backlight).</li>
<li><strong><code>INPUT</code></strong>: The ESP32 listens to see if electricity is coming IN (e.g., button pressed or TTP223 touch sensor triggered).</li>

<ul>

<li data-marpit-fragment="2"><strong>Duty Cycle</strong>:

<h1 id="%F0%9F%9A%A8-5-the-classic-blink-an-led-explained-line-by-line"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 5. The Classic &quot;Blink an LED&quot; Explained Line-by-Line</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">define</span> LED_PIN 2 <span class="hljs-comment">// Connect LED to GPIO 2</span></span>

<span class="hljs-comment">// setup() runs ONCE when the microcontroller powers on</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">setup</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-built_in">pinMode</span>(LED_PIN, OUTPUT); <span class="hljs-comment">// Tell ESP32 that GPIO 2 will send electricity OUT</span>
}

<span class="hljs-comment">// loop() runs repeatedly FOREVER in an infinite cycle</span>
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">loop</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-built_in">digitalWrite</span>(LED_PIN, HIGH); <span class="hljs-comment">// Turn on: Push 3.3V out -&gt; LED glows!</span>
    <span class="hljs-built_in">delay</span>(<span class="hljs-number">1000</span>);                 <span class="hljs-comment">// Pause and wait for 1000 milliseconds (1 second)</span>
    <span class="hljs-built_in">digitalWrite</span>(LED_PIN, LOW);  <span class="hljs-comment">// Turn off: Drop to 0V -&gt; LED dark</span>
    <span class="hljs-built_in">delay</span>(<span class="hljs-number">1000</span>);                 <span class="hljs-comment">// Pause for 1 second</span>
}
</code></pre>
<ul>
<li data-marpit-fragment="1">Every Arduino program has <strong><code>setup()</code></strong> (initialization) and <strong><code>loop()</code></strong> (continuous execution).</li>
</ul>

<h1 id="%F0%9F%8F%97%EF%B8%8F-1-headers--preprocessor-directives"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> 1. Headers &amp; Preprocessor Directives</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">pragma</span> once      <span class="hljs-comment">// Tells the compiler: &quot;Only include this file once&quot; (prevents duplicate errors)</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;Arduino.h&gt;</span> <span class="hljs-comment">// Includes core Arduino functions like pinMode, millis(), delay()</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> PIN_TFT_SCL 8 <span class="hljs-comment">// Text replacement: every time compiler sees PIN_TFT_SCL, it replaces it with 8</span></span>
</code></pre>
<ul>
<li data-marpit-fragment="1"><strong>Header files (<code>.h</code>)</strong>: Contain blueprints, settings, and declarations.</li>
<li data-marpit-fragment="2"><strong>Source files (<code>.cpp</code>)</strong>: Contain the actual logic and implementation code.</li>
<li data-marpit-fragment="3"><strong>Why use <code>#define</code> instead of variables?</strong> <code>#define</code> does not consume any RAM! The compiler replaces text before building the binary.</li>
</ul>
</section>

<h1 id="%F0%9F%93%A6-3-classes-and-object-oriented-programming-oop"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 3. Classes and Object-Oriented Programming (OOP)</h1>
<p>A <strong>Class</strong> is a cookie cutter; an <strong>Object</strong> is the actual cookie.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">RobotEyes</span> {
<span class="hljs-keyword">private</span>: <span class="hljs-comment">// Hidden variables (internal organs)</span>
    <span class="hljs-type">float</span> currentX = <span class="hljs-number">120</span>;
    <span class="hljs-type">float</span> currentY = <span class="hljs-number">120</span>;

<span class="hljs-keyword">public</span>:  <span class="hljs-comment">// Public functions (buttons anyone can press)</span>
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">update</span><span class="hljs-params">()</span> </span>{
        <span class="hljs-comment">// Draw the eyes</span>
    }
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">setMood</span><span class="hljs-params">(PetMood mood)</span> </span>{
        <span class="hljs-comment">// Change eye color</span>
    }
};

<h1 id="%F0%9F%93%B6-1-classic-bluetooth-vs-bluetooth-low-energy-ble"><img class="emoji" draggable="false" alt="📶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f6.svg" data-marp-twemoji=""/> 1. Classic Bluetooth vs Bluetooth Low Energy (BLE)</h1>
<ul>
<li data-marpit-fragment="1"><strong>Classic Bluetooth (e.g. Headphones)</strong>: Constantly streaming audio at 50–100mA. Drains small batteries in 2 hours.</li>
<li data-marpit-fragment="2"><strong>BLE (Bluetooth Low Energy)</strong>: Designed for small bursts of data. Sleeps in microamps and wakes up in milliseconds when your phone pushes a command.</li>
</ul>
</section>

<h1 id="%F0%9F%8C%B3-2-the-gatt-profile-architecture"><img class="emoji" draggable="false" alt="🌳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f333.svg" data-marp-twemoji=""/> 2. The GATT Profile Architecture</h1>
<p>BLE structures communication like a tree:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  [ ESP32-C3 BLE Server: &quot;CYBER_KEYCHAIN&quot; ]
         │
         └── [ PRIMARY SERVICE (UUID: 4fafc201...) ]
                   │
                   ├── Characteristic 1: Mode Switch (Write)
                   ├── Characteristic 2: Avatar Select (Write)
                   ├── Characteristic 3: Custom Text (Write)
                   ├── Characteristic 4: Time &amp; Weather Sync (Write)
                   └── Characteristic 5: Brightness Slider (Write)
</code></pre>
<ul>
<li data-marpit-fragment="1"><strong>UUID (Universally Unique Identifier)</strong>: A unique 128-bit address (e.g. <code>4fafc201-1fb5-...</code>) that your phone uses to find the exact slider or button to talk to.</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">pragma</span> once</span>

<h1 id="%F0%9F%91%80-file-3-robot_eyesh--procedural-animation"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> File 3: <code>robot_eyes.h</code> — Procedural Animation</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// 1. Natural Gaze Tracking</span>
<span class="hljs-keyword">if</span> (now - lastGazeChange &gt; <span class="hljs-number">2500</span> &amp;&amp; !isBlinking) {
    lastGazeChange = now;
    targetX = <span class="hljs-number">120</span> + <span class="hljs-built_in">random</span>(<span class="hljs-number">-25</span>, <span class="hljs-number">26</span>); <span class="hljs-comment">// Pick new horizontal target</span>
    targetY = <span class="hljs-number">120</span> + <span class="hljs-built_in">random</span>(<span class="hljs-number">-15</span>, <span class="hljs-number">16</span>); <span class="hljs-comment">// Pick new vertical target</span>
}

<span class="hljs-comment">// 2. Smooth Interpolation (Easing)</span>
currentX += (targetX - currentX) * <span class="hljs-number">0.2f</span>;
currentY += (targetY - currentY) * <span class="hljs-number">0.2f</span>;
currentH += (targetH - currentH) * <span class="hljs-number">0.35f</span>;

<span class="hljs-comment">// 3. Draw Eyes onto double-buffer canvas</span>
canvas.<span class="hljs-built_in">fillRoundRect</span>(leftEyeX - (eyeWidth/<span class="hljs-number">2</span>), eyeY, eyeWidth, currentH, eyeRadius, eyeColor);
canvas.<span class="hljs-built_in">fillRoundRect</span>(rightEyeX - (eyeWidth/<span class="hljs-number">2</span>), eyeY, eyeWidth, currentH, eyeRadius, eyeColor);

<h1 id="%F0%9F%9B%A0%EF%B8%8F-faqs-1-%E2%80%93-8-soldering--hardware"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> FAQs 1 – 8 (Soldering &amp; Hardware)</h1>
<ol>
<li><strong>Can I build this without a custom PCB?</strong> Yes, the green perfboard with wire bridges is standard and gives a retro cyberpunk aesthetic.</li>
<li><strong>What wires should I use?</strong> 30 AWG flexible silicone wire or enameled copper magnet wire.</li>
<li><strong>Why does my screen stay black?</strong> Check that <code>SCL</code> is on GPIO8, <code>SDA</code> is on GPIO10, and <code>BLK</code> is connected to GPIO2.</li>
<li><strong>Is 3.3V safe for the 1.3&quot; display?</strong> Yes, ST7789 displays run natively on 3.3V logic.</li>
<li><strong>Do I need pull-up resistors on SPI pins?</strong> No, SPI is actively driven push-pull by the ESP32 hardware.</li>
<li><strong>How do I cut the perfboard neatly?</strong> Score both sides with a utility knife along a row of holes, then snap it over a table edge.</li>
<li><strong>Will the solder joints short out on my bag?</strong> Coat the back of the perfboard with 1–2 coats of clear nail polish to insulate it.</li>
<li><strong>Can I attach a metal touch bolt?</strong> Yes, solder a brass screw or copper washer to the TTP223 touch pad to act as a touch trigger.</li>
</ol>
</section>

<h1 id="%F0%9F%94%8B-faqs-9-%E2%80%93-16-battery--charging"><img class="emoji" draggable="false" alt="🔋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50b.svg" data-marp-twemoji=""/> FAQs 9 – 16 (Battery &amp; Charging)</h1>
<ol start="9">
<li><strong>Why MUST I change the resistor on the TP4056?</strong> Default is 1000mA (too high for 200mAh). 4.7kΩ makes it safe at ~250mA.</li>
<li><strong>Can I leave it charging overnight?</strong> Yes, the TP4056 automatically cuts off current when the battery hits 4.20V.</li>
<li><strong>How long will a 200mAh battery last?</strong> In deep sleep mode with ~25 wakeups/day, it easily lasts 2 to 3 weeks.</li>
<li><strong>What happens when the battery gets empty?</strong> The DW01 protection chip on the TP4056 shuts off power before the battery dips below 2.5V.</li>
<li><strong>Can I use a larger 500mAh battery?</strong> Yes, it will last 2.5x longer, just takes slightly more physical room.</li>
<li><strong>Why connect the battery to 5V instead of 3.3V?</strong> A full LiPo outputs 4.2V. The 5V pin feeds through the onboard regulator to drop it safely to 3.3V.</li>
<li><strong>Does the slide switch disable charging?</strong> No, the battery will still charge when plugged into USB regardless of switch state.</li>
<li><strong>Can I play with it while charging?</strong> Yes, it runs normally while connected to USB.</li>
</ol>
</section>

<h1 id="%F0%9F%92%BB-faqs-17-%E2%80%93-24-code--platformio"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> FAQs 17 – 24 (Code &amp; PlatformIO)</h1>
<ol start="17">
<li><strong>How do I upload with PlatformIO?</strong> Open the folder in VS Code, connect USB, and click the Upload arrow icon.</li>
<li><strong>What if upload fails?</strong> Hold the <code>BOOT</code> button on SuperMini, plug in USB, click Upload, then release once flashing starts.</li>
<li><strong>Can I use Arduino IDE?</strong> Yes, install <code>LovyanGFX</code> and <code>NimBLE-Arduino</code> from Library Manager.</li>
<li><strong>Why LovyanGFX instead of TFT_eSPI?</strong> LovyanGFX is faster on ESP32-C3, supports dynamic backlight control, and doesn't require external header setup.</li>
<li><strong>How do I change the default startup mode?</strong> Change <code>currentMode = MODE_CYBERPET;</code> in <code>main.cpp</code> to any other mode.</li>
<li><strong>Can I add custom animations?</strong> Yes, add new sprite drawing routines into <code>include/pet_engine.h</code> using standard shape functions.</li>
<li><strong>What baud rate for Serial monitor?</strong> 115200 baud.</li>
<li><strong>Does the ESP32 remember code when battery dies?</strong> Yes, compiled firmware stays in Flash memory permanently.</li>
</ol>
</section>

<h1 id="%F0%9F%93%B6-faqs-25-%E2%80%93-32-bluetooth--web-remote"><img class="emoji" draggable="false" alt="📶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f6.svg" data-marp-twemoji=""/> FAQs 25 – 32 (Bluetooth &amp; Web Remote)</h1>
<ol start="25">
<li><strong>Do I need internet for Web BLE?</strong> No, you can save <code>index.html</code> on your phone storage and open it offline.</li>
<li><strong>How do I use Web BLE on iPhone?</strong> Use the free <strong>Bluefy</strong> app from the App Store (Safari blocks Web Bluetooth).</li>
<li><strong>How do I use Web BLE on Android?</strong> Open <code>index.html</code> directly in standard <strong>Google Chrome</strong>.</li>
<li><strong>What is the Bluetooth range?</strong> Around 10 to 15 meters line-of-sight.</li>
<li><strong>Can someone else hijack my keychain?</strong> No, once your phone connects, the BLE server stops advertising and locks to your phone.</li>
<li><strong>How do I change the Bluetooth name?</strong> Change <code>&quot;CYBER_KEYCHAIN&quot;</code> in <code>NimBLEDevice::init()</code> in <code>main.cpp</code>.</li>
<li><strong>Can I display live Spotify songs?</strong> Yes, a script on your phone can push song titles via the text characteristic.</li>
<li><strong>How do I host the Web BLE dashboard online?</strong> Upload <code>index.html</code> to a free GitHub repository and enable <strong>GitHub Pages</strong> for a free public URL!</li>
</ol>
</section>
