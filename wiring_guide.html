<ol>
<li>
<p><strong>When USB-C is Plugged In</strong>:</p>
<ul>
<li>The ESP32-C3 SuperMini's USB-C port receives <strong><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="2.828ex" height="1.595ex" role="img" focusable="false" viewBox="0 -683 1250 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z"></path></g><g data-mml-node="mtext" transform="translate(500,0)"><path data-c="56" d="M114 620Q113 621 110 624T107 627T103 630T98 632T91 634T80 635T67 636T48 637H19V683H28Q46 680 152 680Q273 680 294 683H305V637H284Q223 634 223 620Q223 618 313 372T404 126L490 358Q575 588 575 597Q575 616 554 626T508 637H503V683H512Q527 680 627 680Q718 680 724 683H730V637H723Q648 637 627 596Q627 595 515 291T401 -14Q396 -22 382 -22H374H367Q353 -22 348 -14Q346 -12 231 303Q114 617 114 620Z"></path></g></g></g></svg></mjx-container></strong>.</li>

</li>
<li>

<li><strong>Step 3 (Mount Display)</strong>: Solder the 7-pin header of the 1.3&quot; IPS LCD on the front face of the perfboard.</li>
<li><strong>Step 4 (Mount ESP32)</strong>: Solder the ESP32-C3 SuperMini on the back face of the perfboard.</li>
<li><strong>Step 5 (Wire SPI Data Lines)</strong>: Solder Yellow (GPIO8), Green (GPIO10), Blue (GPIO5), Purple (GPIO3), and White (GPIO2) from display to ESP32.</li>
<li><strong>Step 6 (Wire 3.3V &amp; GND Rails)</strong>: Connect <code>3.3V</code> and <code>GND</code> to Display and TTP223 Touch sensor.</li>
<li><strong>Step 7 (Mount Switch)</strong>: Solder the 4mm SPDT Slide Switch onto the side edge of the perfboard.</li>

<h1 id="%F0%9F%A7%AA-pre-power-safety-verification-checklist"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Pre-Power Safety Verification Checklist</h1>
<p>Before sliding the switch to &quot;ON&quot;, check these with a Multimeter (Continuity Mode):</p>
<ul>
<li data-marpit-fragment="1">[ ] <strong>Ground Continuity Test</strong>: Probe ESP32 <code>GND</code>, Display <code>GND</code>, TP4056 <code>IN-</code>, and Battery <code>(-)</code> — all must beep together (shared ground).</li>
<li data-marpit-fragment="2">[ ] <strong>No 3.3V to GND Short</strong>: Probe <code>3.3V</code> and <code>GND</code> — must <strong>NOT</strong> beep (infinite or high resistance).</li>
<li data-marpit-fragment="3">[ ] <strong>No 5V to GND Short</strong>: Probe <code>5V</code> and <code>GND</code> — must <strong>NOT</strong> beep.</li>

<li data-marpit-fragment="5">[ ] <strong>Polarity Check</strong>: Ensure Red wire from LiPo goes to <code>BAT+</code> / Switch, and Black wire goes to <code>BAT-</code> / <code>GND</code>.</li>

<h1 id="%F0%9F%94%8D-troubleshooting-matrix"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Troubleshooting Matrix</h1>
<table>
<thead>
<tr>
<th style="text-align:left">Symptom</th>
<th style="text-align:left">Probable Cause</th>
<th style="text-align:left">Exact Fix</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Screen is completely black</strong></td>
<td style="text-align:left">Backlight <code>BLK</code> pin is floating</td>
<td style="text-align:left">Ensure <code>BLK</code> wire is soldered securely to <code>GPIO 2</code>.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Screen has power but no image</strong></td>
<td style="text-align:left">SPI Clock or Data pins swapped</td>
<td style="text-align:left">Swap <code>SCL</code> (must be GPIO8) and <code>SDA</code> (must be GPIO10).</td>
</tr>
<tr>
<td style="text-align:left"><strong>Touch sensor doesn't wake device</strong></td>
<td style="text-align:left">Wrong GPIO or mode</td>
<td style="text-align:left">Ensure touch <code>I/O</code> wire is on <code>GPIO 1</code> (RTC GPIO domain).</td>
</tr>
<tr>
<td style="text-align:left"><strong>ESP32 reboots continuously</strong></td>
<td style="text-align:left">Battery voltage is <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="6.977ex" height="1.636ex" role="img" focusable="false" viewBox="0 -683 3083.8 723"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path><path data-c="2E" d="M78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z" transform="translate(500,0)"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(778,0)"></path></g><g data-mml-node="mtext" transform="translate(2333.8,0)"><path data-c="56" d="M114 620Q113 621 110 624T107 627T103 630T98
